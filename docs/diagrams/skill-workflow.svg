<text x="230" y="1016" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172b40">Circles: start / thick-outline end | XOR: exclusive choice | [+]: collapsed subprocess | A: paired return links</text>
<text x="230" y="1048" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172b40">Solid arrows show sequence within this process. Detailed retrieval and professional-check rules are in the process-model review.</text>
<text x="230" y="1080" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#172b40">A helper pass does not certify law or complete citator coverage. Brief chat answers can omit saved-run helpers; the skill never files automatically.</text>
