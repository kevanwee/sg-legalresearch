<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1110" viewBox="0 0 2300 1110" role="img" aria-labelledby="title description">
<title id="title">Singapore legal research: saved-run workflow</title>
<desc id="description">Three lanes assign work to the lawyer, research agent and offline helpers. A request starts scoping, access discovery and source retrieval. Retrieval includes independent-source fallback and recording unresolved gaps. Helpers snapshot and index available evidence. The agent assesses legal support, identity, version and treatment, then invokes consistency checks. Errors route to an explicit correction task and return through paired link events A to scoping. Valid records are delivered with limits to the lawyer. The lawyer may request more review or accept the report and complete applicable professional checks and controlled delivery. External publishers supply evidence but do not own internal retrieval tasks.</desc>
