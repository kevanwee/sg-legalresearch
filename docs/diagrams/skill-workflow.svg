<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="940" viewBox="0 0 1680 940" role="img" aria-labelledby="title description">
  <title id="title">How the Singapore legal research skill works</title>
  <desc id="description">Four horizontal swimlanes show the lawyer, agent using the skill, research sources, and optional offline helpers. The lawyer supplies a question or draft. The agent scopes the task, plans research or inventories citations, and retrieves primary sources using session research tools. Saved runs capture sources and exact passages. The agent evaluates legal support, instrument identity, applicable version and treatment. Helpers check record consistency. Errors return for correction and renewed review. The agent delivers pinpointed research or cite-check findings, with gaps, for the lawyer to review. The lawyer then completes applicable citator checks, court-format checks and sign-off before filing, serving or sending.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172b40; }
      .heading { font-size: 26px; font-weight: 700; }
      .subheading { font-size: 16px; fill: #475569; }
      .lane { font-size: 18px; font-weight: 700; }
      .lane-note { font-size: 14px; fill: #475569; }
      .task { fill: white; stroke: #365b75; stroke-width: 1.8; }
      .task-title { font-size: 17px; font-weight: 700; text-anchor: middle; }
      .task-text { font-size: 15px; text-anchor: middle; }
      .flow { fill: none; stroke: #334155; stroke-width: 2; marker-end: url(#arrow); stroke-linejoin: round; }
      .label { font-size: 14px; fill: #334155; }
      .rule { stroke: #b8c7d4; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1680" height="940" fill="white"/>
  <text x="24" y="38" class="heading">From question or draft to traceable findings</text>
  <text x="24" y="66" class="subheading">Responsibilities and hand-offs · Research and cite-check modes · Saved-run path shown</text>

  <!-- Horizontal lanes remain fixed; each task sits with its responsible actor. -->
  <rect x="24" y="92" width="1632" height="170" fill="#f5f8fc"/>
  <rect x="24" y="262" width="1632" height="210" fill="#edf6fb"/>
  <rect x="24" y="472" width="1632" height="170" fill="#f5f8fc"/>
  <rect x="24" y="642" width="1632" height="220" fill="#f0f7f3"/>
  <rect x="24" y="92" width="1632" height="770" fill="none" stroke="#7890a4" stroke-width="1.5"/>
  <path d="M 184 92 V 862 M 24 262 H 1656 M 24 472 H 1656 M 24 642 H 1656" class="rule"/>

  <text x="42" y="164" class="lane">Lawyer</text>
  <text x="42" y="190" class="lane-note">Question and review</text>
  <text x="42" y="343" class="lane">Agent</text>
  <text x="42" y="369" class="lane-note">Uses this skill</text>
  <text x="42" y="543" class="lane">Sources</text>
  <text x="42" y="569" class="lane-note">Via session tools</text>
  <text x="42" y="724" class="lane">Offline helpers</text>
  <text x="42" y="750" class="lane-note">Optional saved run</text>

  <!-- Sequence flows are routed outside task boxes. -->
  <path d="M 300 222 V 302" class="flow"/>
  <path d="M 400 357 H 430" class="flow"/>
  <path d="M 650 357 H 730 V 510" class="flow"/>
  <text x="660" y="402" class="label">Retrieve</text>
  <path d="M 730 604 V 727 H 860" class="flow"/>
  <text x="745" y="674" class="label">Source text</text>
  <path d="M 970 680 V 412" class="flow"/>
  <text x="982" y="546" class="label">Exact passages</text>
  <path d="M 1080 357 H 1205 V 680" class="flow"/>
  <text x="1217" y="546" class="label">Reviewed evidence</text>
  <path d="M 1315 727 H 1345" class="flow"/>
  <path d="M 1400 672 V 590 H 1530 V 412" class="flow"/>
  <text x="1411" y="620" class="label">Yes</text>
  <path d="M 1400 782 V 826 H 820 V 727 H 860" class="flow"/>
  <text x="1020" y="814" class="label">No: correct records or record a genuine limit; repeat review</text>
  <path d="M 1530 302 V 242 H 540 V 222" class="flow"/>
  <text x="960" y="237" class="label">Findings for lawyer review</text>
  <path d="M 650 175 H 670" class="flow"/>
  <path d="M 890 175 H 910" class="flow"/>
  <path d="M 1130 175 H 1150" class="flow"/>
  <path d="M 1370 175 H 1420" class="flow"/>

  <!-- Lawyer tasks run from left to right after findings are returned. -->
  <rect x="200" y="128" width="200" height="94" rx="12" class="task"/>
  <text x="300" y="157" class="task-title">Give the task</text>
  <text x="300" y="182" class="task-text">Question or preserved draft</text>
  <text x="300" y="204" class="task-text">Facts, forum, relevant date</text>
  <rect x="430" y="128" width="220" height="94" rx="12" class="task"/>
  <text x="540" y="157" class="task-title">Review and decide</text>
  <text x="540" y="182" class="task-text">Read decisive passages</text>
  <text x="540" y="204" class="task-text">Resolve gaps; revise as needed</text>
  <rect x="670" y="128" width="220" height="94" rx="12" class="task"/>
  <text x="780" y="157" class="task-title">Check later treatment</text>
  <text x="780" y="182" class="task-text">Authorised citator if available</text>
  <text x="780" y="204" class="task-text">Retain any access limitation</text>
  <rect x="910" y="128" width="220" height="94" rx="12" class="task"/>
  <text x="1020" y="157" class="task-title">Check court format</text>
  <text x="1020" y="182" class="task-text">Applicable Practice Directions</text>
  <text x="1020" y="204" class="task-text">Filing and bundle requirements</text>
  <rect x="1150" y="128" width="220" height="94" rx="12" class="task"/>
  <text x="1260" y="157" class="task-title">Review and sign off</text>
  <text x="1260" y="182" class="task-text">Resolve outstanding issues</text>
  <text x="1260" y="204" class="task-text">Professional responsibility</text>
  <rect x="1420" y="128" width="220" height="94" rx="12" class="task"/>
  <text x="1530" y="157" class="task-title">File, serve or send</text>
  <text x="1530" y="182" class="task-text">Lawyer-controlled action</text>
  <text x="1530" y="204" class="task-text">Separate from skill execution</text>

  <!-- Agent tasks describe instructions and judgment, not automated script powers. -->
  <rect x="200" y="302" width="200" height="110" rx="12" class="task"/>
  <text x="300" y="331" class="task-title">Scope and select mode</text>
  <text x="300" y="356" class="task-text">Question, events, law-as-at</text>
  <text x="300" y="378" class="task-text">Research or cite-check</text>
  <text x="300" y="400" class="task-text">Fresh run for each draft</text>
  <rect x="430" y="302" width="220" height="110" rx="12" class="task"/>
  <text x="540" y="331" class="task-title">Plan the source work</text>
  <text x="540" y="356" class="task-text">Research: map propositions</text>
  <text x="540" y="378" class="task-text">Cite-check: inventory locations</text>
  <text x="540" y="400" class="task-text">Preserve original citations</text>
  <rect x="860" y="302" width="220" height="110" rx="12" class="task"/>
  <text x="970" y="331" class="task-title">Read and assess</text>
  <text x="970" y="356" class="task-text">Passage supports proposition?</text>
  <text x="970" y="378" class="task-text">Right instrument and version?</text>
  <text x="970" y="400" class="task-text">Context and later treatment?</text>
  <rect x="1420" y="302" width="220" height="110" rx="12" class="task"/>
  <text x="1530" y="331" class="task-title">Deliver findings</text>
  <text x="1530" y="356" class="task-text">Memo or cite-check report</text>
  <text x="1530" y="378" class="task-text">Pinpoints; adverse authority</text>
  <text x="1530" y="400" class="task-text">Corrections, coverage and gaps</text>

  <!-- Sources supply material through the agent's available research tools. -->
  <rect x="580" y="510" width="300" height="94" rx="12" class="task"/>
  <text x="730" y="539" class="task-title">Retrieve primary material</text>
  <text x="730" y="564" class="task-text">eLitigation / LawNet · SSO / eGazette</text>
  <text x="730" y="586" class="task-text">Parliament: Bills and Hansard</text>

  <!-- Mechanical validation does not decide whether a legal proposition is sound. -->
  <rect x="860" y="680" width="220" height="94" rx="12" class="task"/>
  <text x="970" y="709" class="task-title">Capture the evidence</text>
  <text x="970" y="734" class="task-text">Snapshots; full cited passages</text>
  <text x="970" y="756" class="task-text">Locators, versions and spans</text>
  <rect x="1095" y="680" width="220" height="94" rx="12" class="task"/>
  <text x="1205" y="709" class="task-title">Check saved records</text>
  <text x="1205" y="734" class="task-text">Hashes, spans and receipts</text>
  <text x="1205" y="756" class="task-text">Coverage, not legal judgment</text>
  <path d="M 1400 672 L 1455 727 L 1400 782 L 1345 727 Z" fill="#fff6d6" stroke="#8a6d22" stroke-width="1.8"/>
  <text x="1400" y="716" class="task-text"><tspan x="1400">Pass</tspan><tspan x="1400" dy="18">status?</tspan></text>

  <text x="24" y="893" class="subheading">Unavailable source → agent records an access gap. Wrong original citation → agent preserves it and verifies any proposed correction separately.</text>
  <text x="24" y="921" class="subheading">Brief chat answers can omit saved-run helpers. A helper pass (including pass-with-limits) does not establish legal correctness or complete citator coverage.</text>
</svg>
